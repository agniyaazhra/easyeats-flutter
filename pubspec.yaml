name: easyeats
description: A beautiful recipe browsing app with full CRUD and JWT auth.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  provider: ^6.1.2

  # Network
  http: ^1.2.1

  # Local storage
  shared_preferences: ^2.3.2

  # Image caching
  cached_network_image: ^3.3.1

  # Shimmer loading effect
  shimmer: ^3.0.0

  # Google Fonts
  google_fonts: ^6.2.1

  # Staggered animations
  flutter_staggered_animations: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
